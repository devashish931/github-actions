name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: pull code
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: install dependencies
        run: yarn install --immutable
      - name: create build
        run: yarn run build
